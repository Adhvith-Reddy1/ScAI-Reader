# Fly.io config for ScAI-Reader.
#
# Single machine, single volume: the browser still holds all personal data
# (highlights, notes), but the PDF/render/text cache under PDF_READER_DATA_DIR
# now lives on a persistent volume so it survives restarts and deploys instead
# of being rebuilt from scratch every time. `fly launch` will fill in / confirm
# `app` and `primary_region` for your account — adjust the placeholders below.
#
# One-time setup after `fly launch --no-deploy` (see docs/DEPLOY.md):
#   fly volumes create scai_reader_data --region iad --size 1

app = "scai-reader"
primary_region = "iad"

[build]

[env]
  # Non-secret config. Free OpenRouter router model; the API key is a secret
  # set with: fly secrets set OPENROUTER_API_KEY=sk-or-...
  OPENROUTER_MODEL = "openrouter/free"
  # Points the app's content cache (PDFs, renders, reader.db) at the mounted
  # volume below instead of the container's ephemeral filesystem.
  PDF_READER_DATA_DIR = "/data"

[[mounts]]
  source = "scai_reader_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle to minimise cost; a request cold-starts the machine.
  # Set min_machines_running = 1 to keep it warm (no cold-start latency).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # The volume mounts to one machine, so a reader's requests must land on it.
  # Keep a SINGLE machine: `fly scale count 1`.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  # Liveness/readiness via the app's health endpoint.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  # PDF rendering (pypdfium2 + Pillow) is the memory-hungry part; 1 GB is safe.
  memory = "1gb"
  cpus = 1
